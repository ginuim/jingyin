<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>镜隐商店截图</title>
  <style>
    :root {
      --tool-bg: #1c1614;
      --tool-surface: #2a211e;
      --tool-elevated: #3a2c27;
      --tool-text: #fff4ee;
      --tool-muted: #c2a89c;
      --tool-line: #5a433a;
      --accent: #d06432;
      --accent-fg: #fff7f2;
      --cream: #f4efe8;
      --ink: #111111;
      --ink-soft: #1a1a1a;
      --cw: 1320px;
      --ch: 2868px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--tool-bg);
      color: var(--tool-text);
      font: 13px/1.45 "PingFang SC", "Hiragino Sans GB", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    button, input, select, textarea { font: inherit; color: inherit; }

    .bar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 14px;
      border-bottom: 1px solid var(--tool-line);
      background: #140f0e;
    }
    .bar h1 { font-size: 14px; font-weight: 650; margin-right: 8px; }
    .bar .grow { flex: 1; }
    .hint { color: var(--tool-muted); }

    .btn {
      border: 0;
      border-radius: 8px;
      padding: 7px 11px;
      background: var(--tool-elevated);
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
    .btn.ghost { background: transparent; border: 1px solid var(--tool-line); }
    .btn.sm { padding: 5px 8px; }
    .btn.active { background: var(--accent); color: var(--accent-fg); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .board {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      justify-content: center;
    }

    .cell {
      position: relative;
      flex: none;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.35);
      background: var(--cream);
    }
    .cell.selected { outline: 2px solid var(--accent); outline-offset: 3px; }
    .cell .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 8;
      background: rgba(20,15,14,0.78);
      color: var(--tool-text);
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      pointer-events: none;
    }

    .shot {
      width: var(--cw);
      height: var(--ch);
      position: relative;
      overflow: hidden;
      background: var(--cream);
      color: var(--ink);
      font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans", "Hiragino Sans GB", "Noto Sans JP", sans-serif;
      transform-origin: top left;
    }

    .plate {
      position: absolute;
      inset: 0;
      z-index: 1;
      transform-origin: top left;
      cursor: grab;
      touch-action: none;
    }
    .plate:active { cursor: grabbing; }
    .plate img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }
    .plate .ph {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a7368;
      font-size: 42px;
      text-align: center;
      padding: 12%;
      pointer-events: none;
    }

    .copy {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: calc(var(--ch) * 0.072) calc(var(--cw) * 0.08) 0;
      pointer-events: none;
    }
    .title {
      font-size: calc(var(--cw) * 0.054);
      font-weight: 700;
      line-height: 1.26;
      letter-spacing: 0.01em;
      white-space: pre-line;
      text-wrap: pretty;
    }
    .subtitle {
      margin-top: calc(var(--ch) * 0.011);
      font-size: calc(var(--cw) * 0.0335);
      font-weight: 400;
      line-height: 1.42;
      color: var(--ink-soft);
      white-space: pre-line;
      text-wrap: pretty;
    }

    .pad {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      object-fit: fill;
      opacity: 0.42;
      pointer-events: none;
    }
    body.hide-pads .pad { display: none; }
    body:not(.hide-pads) .plate .ph { display: none; }

    .status { min-width: 180px; color: var(--tool-muted); }
  </style>
</head>
<body>
  <header class="bar">
    <h1>镜隐商店截图</h1>
    <div id="locales"></div>
    <label class="btn ghost sm" for="batchFiles">导入本语言 3D 原图</label>
    <input id="batchFiles" type="file" accept="image/*" multiple hidden />
    <label class="hint"><input type="checkbox" id="padToggle" checked> 垫图</label>
    <span class="grow"></span>
    <span class="status" id="status">选语言后四张一起铺开，按垫图对齐后导出。</span>
    <button class="btn primary" id="exportAll">导出本语言 ZIP</button>
  </header>
  <main class="board" id="board"></main>

  <script src="./vendor/html2canvas.min.js"></script>
  <script src="./vendor/jszip.min.js"></script>
  <script src="./vendor/FileSaver.min.js"></script>
  <script>
    /*
      Agent API（选语言后一次处理该语言全部截图）:

      await JingyinStore.setLocale('zh-Hans')
      await JingyinStore.setImages([url0, url1, url2, url3])  // 或 File / Blob
      JingyinStore.setTransform(0, { x: 0, y: 0, scale: 1 })
      await JingyinStore.exportZip()
      const files = await JingyinStore.exportBlobs()
    */
    const COPY = {
      "zh-Hans": [
        { title: "分享生活，不必分享隐私", subtitle: "视频与照片，遮住不想公开的部分" },
        { title: "原素材不上传，处理只在本机", subtitle: "识别、编辑与导出，全程在手机上完成" },
        { title: "多张照片，一次处理", subtitle: "统一设置，逐张复核后再导出" },
        { title: "画面、声音、来源信息一起保护", subtitle: "静音或变调，导出时清除位置与拍摄信息" },
      ],
      "zh-Hant": [
        { title: "分享生活，不必分享隱私", subtitle: "影片與照片，遮住不想公開的部分" },
        { title: "原始素材不上傳，只在裝置內處理", subtitle: "辨識、編輯與輸出，全程在裝置上完成" },
        { title: "多張照片，一次處理", subtitle: "統一設定，逐張確認後再輸出" },
        { title: "從畫面到聲音，保護更完整", subtitle: "靜音或變調，輸出時清除位置與拍攝資訊" },
      ],
      en: [
        { title: "Share the moment.\nNot your privacy.", subtitle: "Hide what you don't want seen\nin videos and photos." },
        { title: "Your media stays on your device", subtitle: "Detection, editing,\nand export all happen on-device." },
        { title: "Process multiple photos at once", subtitle: "Apply settings in bulk,\nreview each photo, then export." },
        { title: "Protect more than the picture", subtitle: "Mute or shift voices,\nand remove location and capture details." },
      ],
      ja: [
        { title: "思い出だけをシェア。\nプライバシーは守る", subtitle: "動画や写真で見せたくない部分を\nしっかり隠せます" },
        { title: "素材はアップロード不要。\n処理は端末内で", subtitle: "認識・編集・書き出しまで\nすべて端末内で完結" },
        { title: "複数の写真を\nまとめて処理", subtitle: "設定を一括適用し、\n1枚ずつ確認して書き出し" },
        { title: "映像も音声も、\nまとめて保護", subtitle: "消音・声の高さ変更に加え、\n位置情報や撮影情報も削除" },
      ],
    };
    const LOCALE_LABEL = {
      "zh-Hans": "简中",
      "zh-Hant": "繁中",
      en: "English",
      ja: "日本語",
    };

    const PAD_FILES = {
      "zh-Hans": ["简中-1.png", "简中2.png", "简中3.png", "简中4.png"],
      "zh-Hant": ["繁中1.png", "繁中2.png", "繁中3.png", "繁中4.png"],
      en: ["英文1.png", "英文2.png", "英文3.png", "英文4.png"],
      ja: ["日语1.png", "日语2.png", "日语3.png", "日语4.png"],
    };

    const CANVAS = { w: 1320, h: 2868 };
    const $ = (id) => document.getElementById(id);

    let locale = new URLSearchParams(location.search).get("locale") || "zh-Hans";
    if (!COPY[locale]) locale = "zh-Hans";
    let slides = [];
    let selected = 0;
    let exporting = false;
    let viewScale = 0.22;

    function padUrl(index) {
      const files = PAD_FILES[locale];
      return files && files[index] ? "../" + encodeURI(files[index]) : "";
    }

    function makeSlides() {
      slides = COPY[locale].map((item, i) => ({
        title: item.title,
        subtitle: item.subtitle,
        src: slides[i] && slides[i].src ? slides[i].src : "",
        x: slides[i] ? slides[i].x : 0,
        y: slides[i] ? slides[i].y : 0,
        scale: slides[i] ? slides[i].scale : 1,
        pad: padUrl(i),
      }));
      while (slides.length < COPY[locale].length) {
        const i = slides.length;
        slides.push({ title: "", subtitle: "", src: "", x: 0, y: 0, scale: 1, pad: padUrl(i) });
      }
      slides.length = COPY[locale].length;
      slides.forEach((slide, i) => { slide.pad = padUrl(i); });
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch]));
    }

    function plateCss(slide) {
      return "translate(" + slide.x + "px," + slide.y + "px) scale(" + slide.scale + ")";
    }

    function fitBoard() {
      const board = $("board");
      const n = Math.max(slides.length, 1);
      const gap = 16;
      const pad = 32;
      const availW = board.clientWidth - pad - gap * (n - 1);
      const availH = board.clientHeight - pad;
      const sx = availW / (CANVAS.w * n);
      const sy = availH / CANVAS.h;
      viewScale = Math.max(0.12, Math.min(sx, sy, 0.42));
      document.querySelectorAll(".cell").forEach((cell) => {
        cell.style.width = CANVAS.w * viewScale + "px";
        cell.style.height = CANVAS.h * viewScale + "px";
      });
      document.querySelectorAll(".shot").forEach((shot) => {
        shot.style.transform = "scale(" + viewScale + ")";
      });
    }

    function renderBar() {
      $("locales").innerHTML = Object.keys(COPY).map((key) => {
        const on = key === locale ? " active" : "";
        return '<button class="btn sm' + on + '" data-locale="' + key + '">' + LOCALE_LABEL[key] + "</button>";
      }).join("");
    }

    function renderBoard() {
      $("board").innerHTML = slides.map((slide, i) => {
        const img = slide.src
          ? '<img src="' + slide.src + '" alt="">'
          : '<div class="ph">导入第 ' + (i + 1) + " 张 3D 原图</div>";
        const pad = slide.pad
          ? '<img class="pad" src="' + slide.pad + '" alt="" data-html2canvas-ignore="true">'
          : "";
        return '<article class="cell' + (i === selected ? " selected" : "") + '" data-i="' + i + '">' +
          '<span class="badge">' + String(i + 1).padStart(2, "0") + "</span>" +
          '<div class="shot" data-shot="' + i + '">' +
            '<div class="plate" data-plate="' + i + '" style="transform:' + plateCss(slide) + '">' + img + "</div>" +
            '<div class="copy"><div class="title">' + escapeHtml(slide.title) + "</div>" +
            '<div class="subtitle">' + escapeHtml(slide.subtitle) + "</div></div>" +
            pad +
          "</div></article>";
      }).join("");
      fitBoard();
      bindPlates();
    }

    function bindPlates() {
      document.querySelectorAll(".plate").forEach((node) => {
        const index = Number(node.dataset.plate);
        let dragging = false;
        let last = null;
        node.addEventListener("pointerdown", (e) => {
          selected = index;
          document.querySelectorAll(".cell").forEach((cell) => {
            cell.classList.toggle("selected", Number(cell.dataset.i) === index);
          });
          dragging = true;
          last = { x: e.clientX, y: e.clientY };
          node.setPointerCapture(e.pointerId);
        });
        node.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          slides[index].x += (e.clientX - last.x) / viewScale;
          slides[index].y += (e.clientY - last.y) / viewScale;
          last = { x: e.clientX, y: e.clientY };
          node.style.transform = plateCss(slides[index]);
        });
        node.addEventListener("pointerup", () => { dragging = false; });
        node.addEventListener("wheel", (e) => {
          e.preventDefault();
          selected = index;
          const next = slides[index].scale + (e.deltaY < 0 ? 0.01 : -0.01);
          slides[index].scale = Math.min(1.4, Math.max(0.7, next));
          node.style.transform = plateCss(slides[index]);
        }, { passive: false });
      });
    }

    function setStatus(text) {
      $("status").textContent = text || "";
    }

    function guessIndex(name, fallback) {
      const base = name.replace(/\.[^.]+$/, "");
      const m = base.match(/(\d+)\s*$/) || base.match(/(\d+)/);
      if (!m) return fallback;
      const n = Number(m[1]);
      if (n >= 1 && n <= slides.length) return n - 1;
      return fallback;
    }

    function revokeSrc(slide) {
      if (slide.src && slide.src.startsWith("blob:")) URL.revokeObjectURL(slide.src);
    }

    async function toObjectUrl(input) {
      if (!input) return "";
      if (typeof input === "string") return input;
      if (input instanceof Blob) return URL.createObjectURL(input);
      return "";
    }

    async function setImage(index, input) {
      if (!slides[index]) return;
      const url = await toObjectUrl(input);
      revokeSrc(slides[index]);
      slides[index].src = url;
      slides[index].x = 0;
      slides[index].y = 0;
      slides[index].scale = 1;
      const plate = document.querySelector('[data-plate="' + index + '"]');
      if (!plate) {
        renderBoard();
        return;
      }
      plate.style.transform = plateCss(slides[index]);
      plate.innerHTML = url
        ? '<img src="' + url + '" alt="">'
        : '<div class="ph">导入第 ' + (index + 1) + " 张 3D 原图</div>";
    }

    async function setImages(list) {
      const items = Array.from(list || []);
      await Promise.all(items.map((item, i) => {
        const index = item && item.name ? guessIndex(item.name, i) : i;
        return setImage(index, item);
      }));
      setStatus("已放入 " + items.length + " 张，按垫图对齐");
    }

    async function setLocale(code) {
      if (!COPY[code]) throw new Error("未知语言: " + code);
      locale = code;
      makeSlides();
      selected = 0;
      renderBar();
      renderBoard();
      setStatus("当前语言：" + LOCALE_LABEL[locale] + " · " + slides.length + " 张平铺");
    }

    function setTransform(index, t) {
      const slide = slides[index];
      if (!slide || !t) return;
      if (t.x != null) slide.x = t.x;
      if (t.y != null) slide.y = t.y;
      if (t.scale != null) slide.scale = t.scale;
      const plate = document.querySelector('[data-plate="' + index + '"]');
      if (plate) plate.style.transform = plateCss(slide);
    }

    function waitImages(root) {
      return Promise.all(Array.from(root.querySelectorAll("img")).map((img) => {
        if (img.complete) return Promise.resolve();
        return new Promise((resolve) => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));
    }

    async function captureIndex(index) {
      const source = document.querySelector('[data-shot="' + index + '"]');
      if (!source) throw new Error("找不到第 " + (index + 1) + " 张");
      await waitImages(source);
      const sandbox = document.createElement("div");
      sandbox.style.cssText = "position:fixed;left:-16000px;top:0;width:" + CANVAS.w + "px;height:" + CANVAS.h + "px;overflow:hidden;";
      const clone = source.cloneNode(true);
      clone.style.transform = "none";
      clone.querySelectorAll("[data-html2canvas-ignore]").forEach((el) => el.remove());
      sandbox.appendChild(clone);
      document.body.appendChild(sandbox);
      try {
        await waitImages(clone);
        const canvasEl = await html2canvas(clone, {
          scale: 1,
          width: CANVAS.w,
          height: CANVAS.h,
          windowWidth: CANVAS.w,
          windowHeight: CANVAS.h,
          backgroundColor: "#f4efe8",
          useCORS: true,
          allowTaint: true,
          logging: false,
          imageTimeout: 0,
          ignoreElements: (el) => el.hasAttribute("data-html2canvas-ignore") || el.classList.contains("pad"),
        });
        return await new Promise((resolve, reject) => {
          canvasEl.toBlob((blob) => blob ? resolve(blob) : reject(new Error("PNG 编码失败")), "image/png");
        });
      } finally {
        sandbox.remove();
      }
    }

    function filePrefix() {
      return LOCALE_LABEL[locale] || locale;
    }

    async function exportBlobs() {
      const out = [];
      for (let i = 0; i < slides.length; i++) {
        setStatus("正在导出 " + (i + 1) + " / " + slides.length);
        out.push({
          name: filePrefix() + "-" + (i + 1) + ".png",
          blob: await captureIndex(i),
        });
      }
      return out;
    }

    async function exportZip() {
      if (exporting) return;
      exporting = true;
      const missing = slides.filter((s) => !s.src).length;
      try {
        const zip = new JSZip();
        const files = await exportBlobs();
        files.forEach((file) => zip.file(file.name, file.blob));
        saveAs(await zip.generateAsync({ type: "blob" }), "jingyin-store-screenshots-" + locale + ".zip");
        setStatus("已导出 " + files.length + " 张" + (missing ? "（其中 " + missing + " 页还没放图）" : ""));
        return files;
      } catch (err) {
        setStatus(String(err.message || err));
        throw err;
      } finally {
        exporting = false;
      }
    }

    $("locales").addEventListener("click", (e) => {
      const key = e.target.dataset.locale;
      if (key) setLocale(key);
    });

    $("padToggle").addEventListener("change", (e) => {
      document.body.classList.toggle("hide-pads", !e.target.checked);
    });

    $("batchFiles").addEventListener("change", async (e) => {
      await setImages(e.target.files);
      e.target.value = "";
    });

    $("exportAll").addEventListener("click", () => { exportZip(); });

    $("board").addEventListener("click", (e) => {
      const cell = e.target.closest("[data-i]");
      if (!cell) return;
      selected = Number(cell.dataset.i);
      document.querySelectorAll(".cell").forEach((node) => {
        node.classList.toggle("selected", Number(node.dataset.i) === selected);
      });
    });

    $("board").addEventListener("dragover", (e) => e.preventDefault());
    $("board").addEventListener("drop", async (e) => {
      e.preventDefault();
      const files = Array.from(e.dataTransfer.files || []).filter((f) => f.type.startsWith("image/"));
      if (!files.length) return;
      const cell = e.target.closest("[data-i]");
      if (cell && files.length === 1) await setImage(Number(cell.dataset.i), files[0]);
      else await setImages(files);
    });

    window.addEventListener("resize", fitBoard);

    window.JingyinStore = {
      get locale() { return locale; },
      get slides() { return slides; },
      setLocale,
      setImage,
      setImages,
      setTransform,
      exportBlobs,
      exportZip,
    };

    makeSlides();
    renderBar();
    renderBoard();
    setStatus("当前语言：" + LOCALE_LABEL[locale] + " · 垫图已开，导入 3D 原图对齐");
  </script>
</body>
</html>
